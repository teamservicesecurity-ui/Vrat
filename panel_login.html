<!-- panel/login.html — Dragon RAT v2 Web Panel Login -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragon RAT — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo h1 {
            font-size: 2.2rem;
            color: #ff4444;
            letter-spacing: 4px;
            font-weight: 800;
        }
        .logo h1 span {
            color: #666;
        }
        .logo p {
            color: #555;
            font-size: 0.85rem;
            margin-top: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .card {
            background: #12121a;
            border: 1px solid #1e1e2a;
            border-radius: 16px;
            padding: 32px 28px;
        }
        .card h2 {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 24px;
            text-align: center;
            font-weight: 500;
        }
        .field {
            margin-bottom: 18px;
        }
        .field label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .field input {
            width: 100%;
            padding: 14px 16px;
            background: #0a0a12;
            border: 1px solid #222;
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }
        .field input:focus {
            border-color: #ff4444;
            box-shadow: 0 0 0 2px rgba(255, 68, 68, 0.1);
        }
        .field input::placeholder {
            color: #444;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            background: #cc3333;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .error {
            color: #ff4444;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 14px;
            display: none;
        }
        .error.show {
            display: block;
        }
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #333;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>DRAGON <span>RAT</span></h1>
            <p>v2 — Command Panel</p>
        </div>
        <div class="card">
            <h2>Authorized Access Only</h2>
            <form id="loginForm">
                <div class="field">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter username" autocomplete="off" required autofocus>
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <div class="error" id="errorMsg">Invalid credentials. Try again.</div>
                <button type="submit" class="btn" id="submitBtn">
                    <span id="btnText">Sign In</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </form>
        </div>
        <div class="footer">Authorized Penetration Testing Use Only</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');

            if (!username || !password) {
                errorMsg.textContent = 'Please enter both username and password.';
                errorMsg.classList.add('show');
                return;
            }

            submitBtn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            errorMsg.classList.remove('show');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = data.message || 'Invalid credentials.';
                    errorMsg.classList.add('show');
                    submitBtn.disabled = false;
                    btnText.style.display = 'inline';
                    spinner.style.display = 'none';
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error. Try again.';
                errorMsg.classList.add('show');
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                spinner.style.display = 'none';
            }
        });

        // Enter key submits the form
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
